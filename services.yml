# Throwaway email services Throwlist watches.
#
# id          the service's host
# read        api or page: read automatically by `npm run collect`, one request a run
#             manual: only recorded by hand (`npm run observe`), because its terms forbid
#             automated visits, its robots.txt disallows the page, or it builds addresses in script
# endpoint    the URL a reader fetches; json, pattern and within say where the domains are
# robots      what robots.txt said: allowed, disallowed, none (no robots.txt) or unreachable
# automated   what the terms say about automated visits: forbidden, not mentioned or unknown
# status      active (domains visible), script (built in the browser), blocked (bot check
#             or robots), or dead
# checked     when the service was last read or reviewed
#
# A service whose terms forbid automated visits must stay on read: manual.

